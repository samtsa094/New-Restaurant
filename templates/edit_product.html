{% extends "base.html" %}

{% block title %}Edit {{ product['name'] }} | Restaurant{% endblock %}

{% block navbar %}
<nav class="navbar navbar-expand-lg bg-dark mb-4" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="{{ url_for('owner_shop') }}">Your Restaurant Dashboard</a>
        <a href="{{ url_for('owner_shop') }}" class="btn btn-warning text-dark">Back to dashboard</a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Edit menu item</h1>
                    <form method="post">
                        <div class="mb-3">
                            <label for="product-name" class="form-label">Menu item name</label>
                            <input id="product-name" name="name" type="text" class="form-control" value="{{ product['name'] }}" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="product-description" class="form-label">Description</label>
                            <textarea id="product-description" name="description" class="form-control" rows="3" required>{{ product['description'] }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="product-price" class="form-label">Unit price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input id="product-price" name="price" type="number" min="0" step="0.01" class="form-control" value="{{ product['price'] }}" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="product-image" class="form-label">Image URL</label>
                            <input id="product-image" name="link" type="url" class="form-control" value="{{ product['link'] }}" required>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{{ url_for('owner_shop') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
